name: Build vless-eevee installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag to update (for example v1.1.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
      - name: Install Chromium packaging browser
        run: sudo apt-get update && sudo apt-get install -y chromium-browser
      - name: Build Debian package
        run: bash helper/packaging/build-linux-deb.sh "${{ matrix.arch }}"
        env:
          VLESS_EEVEE_KEY_B64: ${{ secrets.VLESS_EEVEE_KEY_B64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
      - name: Install Chrome for CRX packaging
        shell: pwsh
        run: choco install googlechrome --no-progress -y --ignore-checksums
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.5
      - name: Add WiX to PATH
        run: echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Build MSI
        shell: pwsh
        run: ./helper/packaging/build-windows-msi.ps1
        env:
          VLESS_EEVEE_KEY_B64: ${{ secrets.VLESS_EEVEE_KEY_B64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: dist/*.msi
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Package browser extension
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p dist
          for package in dist/*.deb; do
            architecture="$(dpkg-deb -f "$package" Architecture)"
            mv "$package" "dist/vless-eevee.linux.${architecture}.deb"
          done
          for package in dist/*.msi; do
            mv "$package" dist/vless-eevee.windows.x64.msi
          done
          (cd extension && zip -r "../dist/vless-eevee.extension.zip" .)
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          NOTES=$(cat <<'EOF'
          ## Что нового

          - Добавлена поддержка Linux.
          - Добавлены тест скорости соединения и сортировка серверов по скорости.
          - Можно отправлять выбранные сайты напрямую; список исключений доступен в настройках.
          - Улучшена надёжность проверки серверов и обработки долгих запросов helper'а.
          - Исправлено отображение именованных профилей из подписок.
          EOF
          )
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GH_REPO" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GH_REPO" --title "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/* --repo "$GH_REPO" --clobber
