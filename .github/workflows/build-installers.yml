name: Build vless-eevee installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag to update (for example v1.1.1)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium packaging browser
        run: sudo apt-get update && sudo apt-get install -y chromium-browser
      - name: Build signed extension
        run: |
          mkdir -p dist
          bash helper/packaging/build-extension-crx.sh dist/vless-eevee.extension.crx
        env:
          VLESS_EEVEE_KEY_B64: ${{ secrets.VLESS_EEVEE_KEY_B64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-extension-crx
          path: dist/vless-eevee.extension.crx
          if-no-files-found: error

  linux:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: installer-extension-crx
          path: dist
      - name: Install Linux tray build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Build Debian package
        run: bash helper/packaging/build-linux-deb.sh "${{ matrix.arch }}"
        env:
          VLESS_EEVEE_CRX_FILE: dist/vless-eevee.extension.crx
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Install Chrome for CRX packaging
        shell: pwsh
        run: choco install googlechrome --no-progress -y --ignore-checksums
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.5
      - name: Add WiX to PATH
        run: echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Build MSI
        shell: pwsh
        run: ./helper/packaging/build-windows-msi.ps1
        env:
          VLESS_EEVEE_KEY_B64: ${{ secrets.VLESS_EEVEE_KEY_B64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: dist/*.msi
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Package browser extension
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p dist
          for package in dist/*.deb; do
            architecture="$(dpkg-deb -f "$package" Architecture)"
            target="dist/vless-eevee.${TAG}.linux.${architecture}.deb"
            if [ "$package" != "$target" ]; then mv "$package" "$target"; fi
          done
          for package in dist/*.msi; do
            target="dist/vless-eevee.${TAG}.windows.x64.msi"
            if [ "$package" != "$target" ]; then mv "$package" "$target"; fi
          done
          (cd extension && zip -r "../dist/vless-eevee.extension.zip" .)
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG"]
          version = json.loads(Path("extension/manifest.json").read_text())["version"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"invalid release tag: {tag}")
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag} does not match extension version {version}")
          Path("dist/vless-eevee-updates.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">\n'
              '  <app appid="pflnlemikfjdffpkadjjemologkalkcl">\n'
              f'    <updatecheck codebase="https://github.com/evangelion3131/vless-extension/releases/download/{tag}/vless-eevee.extension.crx" version="{version}"/>\n'
              '  </app>\n'
              '</gupdate>\n',
              encoding="utf-8",
          )
          PY
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          NOTES=$(cat <<'EOF'
          ## Что нового

          - Добавлены трей helper и проверка обновлений компонентов.
          - Добавлены настройки размера и таймаута проверки скорости.
          - Улучшена синхронизация подписок и исправлено падение окна расширения при обновлении хранилища.
          - Для Linux helper использует системный DNS resolver.
          EOF
          )
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GH_REPO" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GH_REPO" --title "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/* --repo "$GH_REPO" --clobber
